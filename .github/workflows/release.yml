# Pushing a version tag (git tag v0.0.2 && git push origin v0.0.2) builds readymade and
# publishes it to PyPI. The version comes from the tag (hatch-vcs). Testing isn't done here:
# run the tests yourself before tagging (on Linux: xvfb-run -a python -m pytest).
# PyPI trusts this workflow through Trusted Publishing: on pypi.org, the readymade
# project's Publishing settings name this repository, release.yml and the "pypi"
# environment, so no API token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - name: Check the version is the tag's
        run: |
          expected="${GITHUB_REF_NAME#v}"
          ls dist/readymade-"$expected"-py3-none-any.whl dist/readymade-"$expected".tar.gz
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # add yourself as a required reviewer to approve each release
    permissions:
      id-token: write  # Trusted Publishing proves who's uploading with this, instead of a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release, with the repository's own token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the history and tags, for the notes
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release, with the files that went to PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          prerelease='(a|b|rc|dev)[0-9]*$'
          # The notes list the commits since the last full release (release candidates don't count).
          previous=$(git tag --list 'v*' --merged "$tag" --sort=-v:refname | grep -vx "$tag" | grep -vE "$prerelease" | head -n 1 || true)
          {
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
              echo
              git log --format='- %s' "$previous..$tag"
              echo
              echo "All the changes: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$tag"
              echo
            fi
            echo "On PyPI: https://pypi.org/project/readymade/$version/"
          } > notes.md
          flags=()
          if [[ "$tag" =~ $prerelease ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" dist/* --title "readymade $version" --notes-file notes.md "${flags[@]}"
