# Pushing a version tag (git tag v0.0.2 && git push origin v0.0.2) tests readymade,
# builds it, and publishes it to PyPI. The version comes from the tag (hatch-vcs).
# PyPI trusts this workflow through Trusted Publishing: on pypi.org, the readymade
# project's Publishing settings name this repository, release.yml and the "pypi"
# environment, so no API token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, for the version
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Xvfb (the tests open their windows on a private display)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install readymade with the IDE's extras, and pytest
        run: python -m pip install -e ".[ide]" pytest
      - name: Run the tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - name: Check the version is the tag's
        run: |
          expected="${GITHUB_REF_NAME#v}"
          ls dist/readymade-"$expected"-py3-none-any.whl dist/readymade-"$expected".tar.gz
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi  # add yourself as a required reviewer to approve each release
    permissions:
      id-token: write  # Trusted Publishing proves who's uploading with this, instead of a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
