[project]
name = "readymade"
dynamic = ["version"]  # from the git tag: v0.0.2 makes 0.0.2 (see [tool.hatch.version])
description = "Visual Basic-style forms for Python: draw a form, double-click to write its code, press F5"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph E. Coleman" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["gui", "rad", "form designer", "ide", "tkinter", "python", "visual basic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
ide = ["pygments>=2.15", "jedi>=0.19", "pillow>=10.1"]  # coloring, completion and Go to Definition, pictures in the designer; the IDE works without them

[project.scripts]
readymade = "readymade.ide.app:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]  # 1.27: for the license fields above
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"  # the version is the latest tag; between tags, a development version like 0.0.2.dev3+g1a2b3c

[tool.hatch.build.targets.sdist]
exclude = ["examples"]  # they hold pictures that aren't for publishing, and each machine's interpreter choice
