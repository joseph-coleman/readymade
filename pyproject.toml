[project]
name = "pybasic"
version = "0.1.0"
description = "Visual Basic 6 style form designer and runtime for Python and Tkinter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ide = ["pygments>=2.15"]  # better code colouring; the IDE works without it

[project.scripts]
pybasic = "pybasic.ide.app:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
